name: 构建安卓 APK（膜登时代）

# 触发：打 apk-* 标签，或手动点击运行（不会和源码打包工作流的 v* 标签冲突）
on:
  push:
    tags: ['apk-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 使用 GitHub runner 自带的 Android SDK（已配置 ANDROID_HOME）
      - name: 确认 Android SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms" && echo "SDK 就绪 ✅" || echo "SDK 路径需确认"

      - name: 安装 Capacitor 依赖
        working-directory: android-app
        run: npm install

      - name: 生成 Android 工程
        working-directory: android-app
        run: npx cap add android

      - name: 生成各密度应用图标（含 Android 8+ 自适应图标）
        working-directory: android-app
        run: |
          pip3 install --quiet Pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import os, re

          src = Image.open('assets/icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          bg = src.getpixel((0, 0))[:3]

          # 抠掉深棕底色，保留香槟金 MDSD 作为自适应图标前景
          fg = src.copy()
          px = fg.load()
          w, h = fg.size
          for y in range(h):
              for x in range(w):
                  r, g, b, a = px[x, y]
                  d = abs(r - bg[0]) + abs(g - bg[1]) + abs(b - bg[2])
                  if d <= 12:
                      px[x, y] = (0, 0, 0, 0)
                  elif d < 60:
                      px[x, y] = (r, g, b, min(a, int(255 * (d - 12) / 48)))

          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              d = os.path.join(res, 'mipmap-' + density)
              os.makedirs(d, exist_ok=True)
              src.resize((size, size), Image.LANCZOS).save(os.path.join(d, 'ic_launcher.png'))
              src.resize((size, size), Image.LANCZOS).save(os.path.join(d, 'ic_launcher_round.png'))
              # 前景内容缩到 62% 居中，避免被圆形/圆角遮罩裁掉
              inner = max(1, int(size * 0.62))
              layer = fg.resize((inner, inner), Image.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(layer, ((size - inner) // 2, (size - inner) // 2))
              canvas.save(os.path.join(d, 'ic_launcher_foreground.png'))

          # 覆盖 Capacitor 默认自适应图标（默认前景是蓝色 C，导致桌面图标不更新）
          v26 = os.path.join(res, 'mipmap-anydpi-v26')
          os.makedirs(v26, exist_ok=True)
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              with open(os.path.join(v26, name), 'w', encoding='utf-8') as f:
                  f.write(adaptive)

          # 背景色与图标底色 #3A2410 保持一致（只改已有定义，避免重复资源）
          for fn in ('colors.xml', 'ic_launcher_background.xml'):
              p = os.path.join(res, 'values', fn)
              if not os.path.exists(p):
                  continue
              s = open(p, encoding='utf-8').read()
              if 'name="ic_launcher_background"' not in s:
                  continue
              s = re.sub(r'(<color[^>]*name="ic_launcher_background"[^>]*>)[^<]*(</color>)', r'\g<1>#3A2410\g<2>', s)
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(s)
          print('图标生成完成（含自适应图标）')
          PYEOF

      - name: 配置应用名、权限与明文访问
        working-directory: android-app
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          # 允许 HTTP 明文访问线上服务器
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          # 确保网络权限
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1<uses-permission android:name="android.permission.INTERNET" />', s, count=1)
          # 图标指向生成的 PNG
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', s)
          s = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('Manifest 已更新')
          # 应用名设为中文「膜登时代」（仅替换 app_name，保留其他字符串）
          sp = 'android/app/src/main/res/values/strings.xml'
          ss = open(sp, encoding='utf-8').read()
          import re as _re
          if '<string name="app_name">' in ss:
              ss = _re.sub(r'<string name="app_name">[^<]*</string>', '<string name="app_name">膜登时代</string>', ss)
          else:
              ss = ss.replace('<resources>', '<resources><string name="app_name">膜登时代</string>')
          open(sp, 'w', encoding='utf-8').write(ss)
          print('strings.xml 已更新')
          PYEOF

      - name: 同步配置并构建 APK
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 生成版本号与安装包
        id: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/apk-* ]]; then
            VER="${GITHUB_REF#refs/tags/apk-}"
          else
            VER="$(date +%Y%m%d-%H%M)"
          fi
          APK="android-app/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK 不存在"; exit 1; }
          cp "$APK" "mengdeng-v${VER}.apk"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          ls -lh "mengdeng-v${VER}.apk"

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.apk.outputs.ver }}
          name: 膜登时代 安卓版 v${{ steps.apk.outputs.ver }}
          files: mengdeng-v${{ steps.apk.outputs.ver }}.apk
          body: |
            ## 膜登时代 安卓版

            直接下载 APK 安装到手机即可。首次安装需在系统设置中允许「安装未知来源应用」。

            - 版本：v${{ steps.apk.outputs.ver }}
            - 类型：Android 安装包（APK）
            - 本次修复：桌面图标改为膜登时代 MDSD 标志（含 Android 8+ 自适应图标）
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
